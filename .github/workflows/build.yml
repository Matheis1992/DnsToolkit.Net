name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Windows is needed for net48, which runs the tests against the netstandard2.0 build
    name: Windows (net48, net8.0, net10.0)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build DnsToolkit.Net.sln -c Release

      - name: Test
        run: dotnet test DnsToolkit.Net.Tests/DnsToolkit.Net.Tests.csproj -c Release --no-build --blame-hang-timeout 60s --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults

  linux:
    name: Linux (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [ net8.0, net10.0 ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test DnsToolkit.Net.Tests/DnsToolkit.Net.Tests.csproj -c Release -f ${{ matrix.framework }} --blame-hang-timeout 60s --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-${{ matrix.framework }}
          path: TestResults
